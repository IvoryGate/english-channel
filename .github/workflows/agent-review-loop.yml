name: agent-review-loop

on:
  workflow_dispatch:
    inputs:
      iteration:
        required: true
        default: "1"
      max_iterations:
        required: true
        default: "2"
      pr_number:
        required: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node packages/tooling/scripts/agent-review-loop.mjs
